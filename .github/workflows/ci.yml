name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, fast suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-prod.txt

      # Serving + test deps only: torch / gymnasium / sb3 are not installed, so
      # train-path tests skip and the import-firewall tests run against prod deps.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -m "not slow and not train"

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No NEXT_PUBLIC_WS_URL here: the unit tests assert the dev default URL.
      - name: Unit tests
        run: npm test

      # Production builds need a WS URL (without one the UI shows a config banner).
      # Playwright is intentionally not run in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WS_URL: wss://example.invalid/ws
